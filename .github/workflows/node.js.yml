name: My Portfolio CI/CD

on:
  push:
    branches: [ "devops" ]
  pull_request:
    branches: [ "devops" ]

jobs:
   build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        working-directory: ./project/public
        run: docker build -t subhamsharma2/my-web .

      - name: Push Docker image to Docker Hub
        run: docker push subhamsharma2/my-web

   deploy:
     runs-on: self-hosted 
     needs: build-and-push-docker
     steps:
       - name: pulling docker image
         run: docker pull ${{ secrets.DOCKER_USERNAME }}/my-web
       - name: Runnin docker image on self hosted runner
         run: docker run -d --name my-web1 -p:8080:80 ${{ secrets.DOCKER_USERNAME }}/my-web
    
   
